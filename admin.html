<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#eeeef1">
  <title>Einprosit · Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=20">
</head>
<body>

  <div id="loading" class="gate"><p style="color:var(--ink-3)">Loading…</p></div>

  <div id="login" class="gate hidden">
    <div class="card">
      <div class="kicker">Einprosit · Admin</div>
      <h1>Sign in</h1>
      <p>Administrator access.</p>
      <form id="loginForm">
        <label>Email
          <input type="email" id="loginEmail" required autocomplete="username" value="durigon.federico@gmail.com">
        </label>
        <label>Password
          <input type="password" id="loginPassword" required autocomplete="current-password">
        </label>
        <button class="btn" type="submit" id="loginBtn">Log in</button>
      </form>
    </div>
  </div>

  <div id="denied" class="gate hidden">
    <div class="card">
      <div class="kicker">Einprosit · Admin</div>
      <h1>Not authorised</h1>
      <p id="deniedMsg">This account is not enabled as an administrator.</p>
      <div class="actions" style="justify-content:center"><button class="btn ghost" data-logout>Sign out</button></div>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand">
        <div class="kicker">Admin · Antica Maddalena</div>
        <h1>Einprosit</h1>
        <p>Request management</p>
      </div>
      <ul id="dinnerList" class="dinner-list"></ul>
      <div class="sidebar-foot admin-links"><a href="log.html">Activity log (backup) →</a><button class="btn ghost small" data-logout>Sign out</button></div>
    </aside>

    <main class="main">
      <div class="topbar"><span id="who"></span><span id="live">● live updates</span></div>

      <header class="d-head">
        <div class="kicker" id="dDate"></div>
        <h2 id="dTitle"></h2>
        <p class="sub" id="dSub"></p>
        <div class="chef-tags" id="dChefs"></div>
      </header>

      <h3 class="section-title">Requests</h3>
      <div class="filters" id="filters">
        <button class="chip on" data-f="all">All</button>
        <button class="chip" data-f="in_attesa">Pending</button>
        <button class="chip" data-f="disponibile">Available</button>
        <button class="chip" data-f="non_disponibile">Not available</button>
      </div>
      <ul id="reqList" class="req-list"></ul>

      <h3 class="section-title">Dinner details</h3>
      <form id="dinnerForm" class="card">
        <div class="form-grid">
          <label>Title <input type="text" id="eTitle" maxlength="80" required></label>
          <label>Date &amp; time <input type="datetime-local" id="eDate"></label>
          <label class="full">Subtitle <input type="text" id="eSub" maxlength="120" placeholder="e.g. Four-hands dinner"></label>
          <label class="full">Chefs <span style="font-weight:400;color:var(--ink-3)">(comma-separated — these become the name tags chefs pick from)</span> <input type="text" id="eChefs" maxlength="200" placeholder="e.g. Rossi, Bianchi"></label>
          <label>Order in list <input type="number" id="eOrder" min="0" max="99" step="1"></label>
        </div>
        <div class="actions"><button class="btn" type="submit">Save details</button></div>
      </form>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/config.js?v=3"></script>
  <script src="assets/common.js?v=11"></script>
  <script>
  (function () {
    const { sb, esc, dinnerDate, STATUS, toast, shortDate, price, setChefColors, chefStyle, photoUrl, QTY_UNITS, PRICE_UNITS, PRICE_SUFFIX, lineTotal, billedQty, lineTotalMin, parseQty, toNum, fmtNum } = window.EP;
    const $ = (id) => document.getElementById(id);
    const views = ["loading", "login", "denied", "app"];
    const show = (id) => views.forEach((v) => $(v).classList.toggle("hidden", v !== id));

    let dinners = [];
    let requests = [];
    let currentId = null;
    let filter = "all";
    let channel = null;

    // ---------- auth ----------
    $("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("loginBtn").disabled = true;
      const { error } = await sb.auth.signInWithPassword({
        email: $("loginEmail").value.trim(),
        password: $("loginPassword").value,
      });
      $("loginBtn").disabled = false;
      if (error) return toast(/invalid/i.test(error.message) ? "Wrong email or password" : error.message, true);
      $("loginPassword").value = "";
    });

    document.querySelectorAll("[data-logout]").forEach((b) =>
      b.addEventListener("click", async () => { await sb.auth.signOut({ scope: "local" }); location.reload(); }));

    async function boot(session) {
      if (!session) return show("login");
      const { data: ok, error } = await sb.rpc("is_admin");
      if (error || !ok) {
        $("deniedMsg").textContent = `${session.user.email} is not enabled as an administrator.`;
        return show("denied");
      }
      $("who").textContent = session.user.email;
      show("app");
      await loadDinners();
      subscribe();
    }

    const authErr = new URLSearchParams(location.hash.slice(1)).get("error_description");
    if (authErr) {
      setTimeout(() => toast(/expired|invalid/i.test(authErr) ? "This sign-in link has expired or was already used. Request a new one." : authErr, true), 300);
      history.replaceState(null, "", location.pathname);
    }

    let booted = false;
    sb.auth.onAuthStateChange((evt, session) => {
      if (evt === "INITIAL_SESSION" || (evt === "SIGNED_IN" && !booted)) {
        booted = !!session;
        // run outside the auth callback so Supabase calls inside boot() don't deadlock
        setTimeout(() => boot(session), 0);
      }
      if (evt === "SIGNED_OUT") { booted = false; show("login"); }
    });

    // ---------- data ----------
    async function loadDinners() {
      const { data, error } = await sb.from("dinners").select("*").order("sort_order").order("starts_at");
      if (error) return toast("Couldn't load dinners", true);
      dinners = data;
      setChefColors(dinners);
      if (!currentId || !dinners.find((d) => d.id === currentId)) {
        currentId = (new URLSearchParams(location.hash.slice(1)).get("d")) || dinners[0]?.id;
      }
      await loadRequests();
    }

    async function loadRequests() {
      const { data, error } = await sb.from("ingredient_requests")
        .select("*, request_offers(*)")
        .is("request_offers.removed_at", null)
        .order("created_at", { ascending: false });
      if (error) return toast("Couldn't load requests", true);
      data.forEach((r) => (r.request_offers || []).sort((a, b) => a.sort_order - b.sort_order || a.created_at.localeCompare(b.created_at)));
      requests = data;
      render();
    }

    function subscribe() {
      if (channel) return;
      channel = sb.channel("requests")
        .on("postgres_changes", { event: "*", schema: "public", table: "ingredient_requests" }, () => loadRequests())
        .on("postgres_changes", { event: "*", schema: "public", table: "request_offers" }, () => loadRequests())
        .subscribe((status) => {
          $("live").style.color = status === "SUBSCRIBED" ? "var(--ok)" : "var(--ink-3)";
        });
      document.addEventListener("visibilitychange", () => { if (!document.hidden) loadRequests(); });
    }

    // ---------- render ----------
    function render() {
      const d = dinners.find((x) => x.id === currentId);
      if (!d) return;
      history.replaceState(null, "", "#d=" + d.id);

      $("dinnerList").innerHTML = dinners.map((x) => {
        return `<li><button class="dinner-btn ${x.id === currentId ? "active" : ""}" data-id="${x.id}">
          <span class="d-date">${esc(dinnerDate(x.starts_at))}</span>
          <span class="d-title">${esc(x.title)}</span>
          ${x.subtitle ? `<span class="d-sub">${esc(x.subtitle)}</span>` : ""}
        </button></li>`;
      }).join("");

      $("dDate").textContent = dinnerDate(d.starts_at);
      $("dTitle").textContent = d.title;
      $("dSub").textContent = d.subtitle || "";
      $("dChefs").innerHTML = (d.chefs || "").split(",").map((c) => c.trim()).filter(Boolean).map((c) => `<span class="tag" style="${chefStyle(c)}">${esc(c)}</span>`).join("");

      if (document.activeElement?.closest("#dinnerForm") == null) {
        $("eTitle").value = d.title;
        $("eSub").value = d.subtitle || "";
        $("eChefs").value = d.chefs || "";
        $("eOrder").value = d.sort_order;
        $("eDate").value = d.starts_at ? toLocalInput(d.starts_at) : "";
      }

      const mine = requests.filter((r) => r.dinner_id === currentId);

      // Don't redraw while a request has unsaved changes or is being typed in
      const list = $("reqList");
      const busy = list.querySelector(".req[data-dirty]") || document.activeElement?.closest("#reqList .req");
      const rows = mine.filter((r) => filter === "all" || r.status === filter);
      if (busy && list.dataset.dinner === currentId) return;
      list.dataset.dinner = currentId;
      if (!rows.length) {
        list.innerHTML = `<li class="empty">No requests${filter !== "all" ? " with this status" : ""}.</li>`;
        return;
      }
      list.innerHTML = rows.map(requestCard).join("");
      list.querySelectorAll(".req").forEach((li) => { if (li.querySelector(".offer")) updateTotal(li); });
    }

    const decIn = (n) => (n == null ? "" : String(Number(n)).replace(".", ","));
    const opts = (map, cur) => Object.entries(map).map(([k, v]) => `<option value="${k}" ${k === cur ? "selected" : ""}>${v}</option>`).join("");

    function offerLine(o, req) {
      o = o || {};
      if (!o.id && req) { const q = parseQty(req.quantity); o = { qty_amount: q.amount, qty_unit: q.unit, price_unit: q.unit }; }
      const url = photoUrl(o.photo_path);
      const qtyUnit = o.qty_unit || "kg";
      const priceUnit = o.price_unit || (o.id ? "total" : qtyUnit);
      return `<div class="offer" data-offer="${esc(o.id || "")}">
        <label class="offer-photo" title="${url ? "Change photo" : "Add a photo"}">
          <input type="file" accept="image/*" data-k="photo" hidden>
          <input type="hidden" data-k="photo_path" value="${esc(o.photo_path || "")}">
          ${url ? `<img src="${esc(url)}" alt="">` : `<span class="ph">+ Photo</span>`}
        </label>
        <div class="offer-fields">
          <input type="text" data-k="supplier" maxlength="120" value="${esc(o.supplier || "")}" placeholder="Supplier" aria-label="Supplier">
          <input type="text" data-k="product" maxlength="160" value="${esc(o.product || "")}" placeholder="Product / brand" aria-label="Product">
          <div class="unit-field" data-label="Quantity">
            <input type="text" data-k="qty_amount" inputmode="decimal" value="${decIn(o.qty_amount)}" placeholder="Qty" aria-label="Quantity">
            <select data-k="qty_unit" aria-label="Quantity unit">${opts(QTY_UNITS, qtyUnit)}</select>
          </div>
          <div class="unit-field" data-label="Min. order (optional)" title="Minimum order: if the chef asks for less, this amount is billed">
            <input type="text" data-k="min_amount" inputmode="decimal" value="${decIn(o.min_amount)}" placeholder="—" aria-label="Minimum order">
            <select data-k="min_unit" aria-label="Minimum order unit">${opts(QTY_UNITS, o.min_unit || qtyUnit)}</select>
          </div>
          <div class="unit-field" data-label="Price">
            <input type="text" data-k="price" inputmode="decimal" value="${decIn(o.price)}" placeholder="€ 0,00" aria-label="Price">
            <select data-k="price_unit" aria-label="Price is">${opts(PRICE_UNITS, priceUnit)}</select>
          </div>
          <input type="text" data-k="note" maxlength="500" value="${esc(o.note || "")}" placeholder="Note (visible to chefs)" aria-label="Line note" class="offer-note">
        </div>
        <div class="offer-side">
          <span class="line-total" data-line-total></span>
          <label class="offer-pick" title="Chosen: counts in the total">
            <input type="checkbox" data-k="selected" ${o.selected ? "checked" : ""}><span>Chosen</span>
          </label>
        </div>
        <button type="button" class="row-btn danger" data-act="rm-line" aria-label="Remove line" title="Remove line">×</button>
      </div>`;
    }

    function requestCard(r) {
      const offers = r.request_offers || [];
      return `<li class="req admin-req" data-id="${r.id}">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:start">
          <div class="item">${esc(r.item)}${r.quantity ? ` <span class="qty">· ${esc(r.quantity)}</span>` : ""}</div>
          <span class="pill ${r.status}">${STATUS[r.status]}</span>
        </div>
        ${r.notes ? `<div class="notes">${esc(r.notes)}</div>` : ""}
        <div class="meta"><span class="tag" style="${chefStyle(r.chef_name)}">${esc(r.chef_name)}</span><span>${esc(shortDate(r.created_at))}</span></div>

        <div class="offers-box">
          <div class="offers-head"><span>Suppliers &amp; prices</span><span class="hint">Tick "Chosen" on the lines you'll buy — their prices make the total.</span></div>
          <div class="offers">${offers.map((o) => offerLine(o)).join("")}</div>
          <button type="button" class="btn ghost small" data-act="add-line">+ Add line</button>
        </div>

        <div class="admin-controls">
          <label>Availability
            <select data-k="status">
              ${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${k === r.status ? "selected" : ""}>${v}</option>`).join("")}
            </select>
          </label>
          <label class="note-field">Note for the chef
            <input type="text" data-k="admin_note" maxlength="500" value="${esc(r.admin_note || "")}" placeholder="e.g. arrives Friday morning">
          </label>
          <div class="req-total"><span>Total</span><b data-total>${r.price != null ? price(r.price) : "—"}</b></div>
          <button class="btn small" data-act="save">Save</button>
        </div>
        <div class="req-foot">
          <span class="unsaved">Unsaved changes</span>
          <button class="btn danger small" data-act="del" style="padding:4px 10px;font-size:12px">Delete request</button>
        </div>
      </li>`;
    }

    function readOffers(li) {
      return [...li.querySelectorAll(".offer")].map((el) => {
        const v = (k) => el.querySelector(`[data-k="${k}"]`);
        return {
          id: el.dataset.offer || null,
          supplier: v("supplier").value, product: v("product").value,
          qty_amount: toNum(v("qty_amount").value), qty_unit: v("qty_unit").value,
          min_amount: toNum(v("min_amount").value), min_unit: toNum(v("min_amount").value) == null ? null : v("min_unit").value,
          price: toNum(v("price").value), price_unit: v("price_unit").value,
          note: v("note").value, photo_path: v("photo_path").value || null, selected: v("selected").checked,
        };
      }).filter((o) => o.id || o.supplier.trim() || o.product.trim() || o.qty_amount != null || o.min_amount != null || o.price != null || o.note.trim() || o.photo_path);
    }

    // per-line "= €xx" and the request total, same maths as the database
    function updateTotal(li) {
      const offers = readOffers(li);
      li.querySelectorAll(".offer").forEach((el) => {
        const v = (k) => el.querySelector(`[data-k="${k}"]`).value;
        const pr = toNum(v("price")), q = toNum(v("qty_amount")), pu = v("price_unit"), qu = v("qty_unit");
        const mn = toNum(v("min_amount")), mu = mn == null ? null : v("min_unit");
        const b = billedQty(q, qu, mn, mu);
        const t = lineTotalMin(pr, pu, q, qu, mn, mu);
        const out = el.querySelector("[data-line-total]");
        out.classList.toggle("warn", (pr != null && t == null) || !!b.mismatch);
        out.textContent = pr == null ? (b.mismatch ? "Min. order unit doesn't match" : b.raised ? `Min. order ${fmtNum(mn)} ${mu} applies` : "")
          : t != null
            ? (pu === "total" ? "= " + price(t) : `${b.raised ? `min. ${fmtNum(mn)} ${mu}` : `${fmtNum(b.qty)} ${b.unit}`} × ${price(pr)}${PRICE_SUFFIX[pu]} = ${price(t)}`)
            : (b.mismatch ? "Min. order unit doesn't match" : b.qty == null ? "Add the quantity" : "Units don't match");
      });
      const totals = offers.map((o) => ({ ...o, t: lineTotalMin(o.price, o.price_unit, o.qty_amount, o.qty_unit, o.min_amount, o.min_unit) }));
      const chosen = totals.filter((o) => o.selected);
      const use = chosen.length ? chosen : totals.length === 1 ? totals : [];
      const nums = use.map((o) => o.t).filter((n) => n != null);
      li.querySelector("[data-total]").textContent = nums.length ? price(nums.reduce((a, b) => a + b, 0)) : "—";
    }

    function markDirty(li) { li.dataset.dirty = "1"; }

    const withTimeout = (p, ms, fallback) => Promise.race([p, new Promise((res) => setTimeout(() => res(fallback), ms))]);
    const uid = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID()
      : Date.now().toString(36) + "-" + Array.from((window.crypto || {}).getRandomValues ? crypto.getRandomValues(new Uint8Array(10)) : [Math.random() * 1e9]).map((b) => (b | 0).toString(16)).join(""));

    // Shrink photos before upload (phone pictures are large)
    async function shrink(file) {
      try {
        const bmp = await createImageBitmap(file);
        const max = 1600, k = Math.min(1, max / Math.max(bmp.width, bmp.height));
        const c = document.createElement("canvas");
        c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
        c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
        const blob = await new Promise((res) => c.toBlob(res, "image/jpeg", 0.85));
        return blob || file;
      } catch { return file; }
    }

    function toLocalInput(ts) {
      const d = new Date(ts);
      const p = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    // ---------- events ----------
    $("dinnerList").addEventListener("click", (e) => {
      const b = e.target.closest(".dinner-btn");
      if (!b) return;
      if (document.querySelector(".req[data-dirty]") && !confirm("You have unsaved changes. Leave them?")) return;
      document.querySelectorAll(".req[data-dirty]").forEach((x) => delete x.dataset.dirty);
      currentId = b.dataset.id;
      document.activeElement?.blur();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    $("filters").addEventListener("click", (e) => {
      const c = e.target.closest(".chip");
      if (!c) return;
      if (document.querySelector(".req[data-dirty]") && !confirm("You have unsaved changes. Leave them?")) return;
      document.querySelectorAll(".req[data-dirty]").forEach((x) => delete x.dataset.dirty);
      filter = c.dataset.f;
      document.querySelectorAll("#filters .chip").forEach((x) => x.classList.toggle("on", x === c));
      render();
    });

    $("reqList").addEventListener("click", async (e) => {
      const btn = e.target.closest("[data-act]");
      if (!btn) return;
      const li = btn.closest(".req");
      const id = li.dataset.id;

      if (btn.dataset.act === "del") {
        if (!confirm("Delete this request permanently?")) return;
        const { error } = await sb.from("ingredient_requests").delete().eq("id", id);
        if (error) return toast(error.message, true);
        toast("Request deleted");
        btn.blur();
        return loadRequests();
      }

      if (btn.dataset.act === "add-line") {
        btn.previousElementSibling.insertAdjacentHTML("beforeend", offerLine(null, requests.find((r) => r.id === id)));
        updateTotal(li);
        btn.previousElementSibling.lastElementChild.querySelector('[data-k="supplier"]').focus();
        markDirty(li);
        return;
      }
      if (btn.dataset.act === "rm-line") {
        btn.closest(".offer").remove();
        markDirty(li); updateTotal(li);
        return;
      }
      if (btn.dataset.act !== "save") return;

      const status = li.querySelector('[data-k="status"]').value;
      const note = li.querySelector('[data-k="admin_note"]').value.trim();
      if (li.querySelector(".offer.uploading")) return toast("Wait for the photo to finish uploading", true);
      const offersToSave = readOffers(li);
      const bad = offersToSave.find((o) => (o.price != null && (isNaN(o.price) || o.price < 0)) || (o.qty_amount != null && (isNaN(o.qty_amount) || o.qty_amount < 0)) || (o.min_amount != null && (isNaN(o.min_amount) || o.min_amount < 0)));
      if (bad) return toast("Check the numbers — use something like 12,50", true);
      btn.disabled = true;
      const { error } = await sb.rpc("admin_save_request", { p_id: id, p_status: status, p_admin_note: note, p_offers: offersToSave });
      btn.disabled = false;
      btn.blur();
      if (error) return toast(error.message, true);
      delete li.dataset.dirty;
      toast("Saved");
      loadRequests();
    });

    $("reqList").addEventListener("input", (e) => {
      const li = e.target.closest(".req"); if (!li) return;
      markDirty(li);
      if (e.target.closest(".offer")) updateTotal(li);
    });

    $("reqList").addEventListener("change", async (e) => {
      const li = e.target.closest(".req"); if (!li) return;
      markDirty(li);
      if (e.target.closest(".offer")) updateTotal(li);
      if (!e.target.matches('[data-k="photo"]') || !e.target.files[0]) return;
      const input = e.target;
      const file = input.files[0];
      const line = input.closest(".offer");
      const box = line.querySelector(".offer-photo");
      const oldPath = line.querySelector('[data-k="photo_path"]').value;
      const showPhoto = (path) => {
        const cur = box.querySelector("img, .ph");
        cur.outerHTML = path ? `<img src="${esc(photoUrl(path))}" alt="">` : `<span class="ph">+ Photo</span>`;
      };
      if (line.classList.contains("uploading")) return;
      line.classList.add("uploading");
      box.querySelector("img, .ph").outerHTML = `<span class="ph">Uploading…</span>`;
      try {
        if (!/^image\/(jpeg|png|webp|heic|heif)$/i.test(file.type || "") && !/\.(jpe?g|png|webp|heic|heif)$/i.test(file.name || "")) {
          throw new Error("Please choose a photo (JPG or PNG)");
        }
        const blob = await withTimeout(shrink(file), 20000, null) || file;
        if (!/^image\/(jpeg|png|webp)$/i.test(blob.type || "")) {
          throw new Error("This photo format can't be read here — please use JPG or PNG");
        }
        if (blob.size > 8 * 1024 * 1024) throw new Error("Photo too large (max 8 MB)");
        const ext = blob.type === "image/png" ? "png" : blob.type === "image/webp" ? "webp" : "jpg";
        const path = `${li.dataset.id}/${uid()}.${ext}`;
        const res = await withTimeout(
          sb.storage.from("product-photos").upload(path, blob, { contentType: blob.type, upsert: false }),
          60000, { error: { message: "the connection timed out" } });
        if (res.error) throw new Error("Upload failed: " + res.error.message);
        line.querySelector('[data-k="photo_path"]').value = path;
        showPhoto(path);
        toast("Photo added — press Save to keep it");
      } catch (err) {
        showPhoto(oldPath);
        toast(err && err.message ? err.message : "Upload failed", true);
      } finally {
        line.classList.remove("uploading");
        input.value = "";
      }
    });

    window.addEventListener("beforeunload", (e) => {
      if (document.querySelector(".req[data-dirty]")) { e.preventDefault(); e.returnValue = ""; }
    });

    $("dinnerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const dt = $("eDate").value;
      const { error } = await sb.from("dinners").update({
        title: $("eTitle").value.trim(),
        subtitle: $("eSub").value.trim() || null,
        chefs: $("eChefs").value.trim() || null,
        sort_order: Number($("eOrder").value || 0),
        starts_at: dt ? new Date(dt).toISOString() : null,
      }).eq("id", currentId);
      document.activeElement?.blur();
      if (error) return toast(error.message, true);
      toast("Details saved");
      loadDinners();
    });
  })();
  </script>
</body>
</html>
